logging:
  level:
    root: INFO
    com.baomidou.mybatisplus: INFO
    com.doumiot.sshconsole: INFO

doumi:
  storage:
    data-dir: ${DOUMI_DATA_DIR:./data}

  ssh-console:
    enabled: true
    credential-master-key: ${SSH_CONSOLE_MASTER_KEY:}
    max-sessions: 50
    idle-timeout-minutes: 30
    upload-max-size-mb: 512
    monitor-enabled: true
    monitor-min-interval-ms: 5000
    monitor-disk-interval-ms: 60000
    script-run-timeout-sec: 0
    tmux-enabled: true
    # AI 限制可通过外置 config/application.yml 或环境变量覆盖
    ai-max-rounds: ${DOUMI_AI_MAX_ROUNDS:24}
    ai-max-context-messages: ${DOUMI_AI_MAX_CONTEXT_MESSAGES:400}
    ai-max-context-chars: ${DOUMI_AI_MAX_CONTEXT_CHARS:1048576}
    ai-max-tool-calls: ${DOUMI_AI_MAX_TOOL_CALLS:64}

spring:
  mvc:
    async:
      request-timeout: 0
  application:
    name: doumi
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB

server:
  port: ${DOUMI_PORT:80}

app:
  database:
    init:
      enabled: true
      mode: AUTO
      scripts:
        - sql/sqlite_schema.sql
      fail-fast: true


mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
